<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | ICS</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="global-header">
      <div class="nav-shell">
        <a class="logo" href="index.html"><span class="logo-mark">I</span>Island</a>
        <nav class="primary-nav">
          <a href="products.html">Products</a>
          <a href="pricing.html">Pricing</a>
          <a href="resources.html">Resources</a>
          <a href="company.html">Company</a>
          <a href="company/contact.html">Contact</a>
        </nav>
        <div class="nav-cta">
          <a class="link" href="signin.html">Sign in</a>
          <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
        </div>
      </div>
      <div class="mobile-menu">
        <a href="products.html">Products</a>
        <a href="pricing.html">Pricing</a>
        <a href="resources.html">Resources</a>
        <a href="company.html">Company</a>
        <a href="company/contact.html">Contact</a>
        <a class="btn ghost" href="signin.html">Sign in</a>
      </div>
    </header>

    <main>
      <div class="page-shell" style="max-width:600px;">
        <section class="hero">
          <div>
            <h1>Try ICS for free</h1>
            <p>Sign up to receive launch credits and start your first island.</p>
            <form class="inline-form">
              <label>Full name<input type="text" /></label>
              <label>Work email<input type="email" /></label>
              <label>Company<input type="text" /></label>
              <label>Password<input type="password" /></label>
              <div class="form-actions">
                <button class="btn primary" type="button">Create account</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-shell">
        <small>© 2024 Island Computing Services</small>
      </div>
    </footer>

    <script>
      const toggle = document.querySelector('.menu-toggle');
      const mobile = document.querySelector('.mobile-menu');
      toggle?.addEventListener('click', () => mobile?.classList.toggle('open'));
    </script>
  </body>
</html>
